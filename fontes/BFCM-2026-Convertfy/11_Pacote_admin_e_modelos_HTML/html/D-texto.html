<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="x-apple-disable-message-reformatting"><title>Texto com pessoa no remetente</title>
<style>body{margin:0;padding:0;background:#ffffff} img{border:0;display:block} a{color:#000000}
@media (max-width:620px){.w{width:100%!important} .col{display:block!important;width:100%!important} .px{padding-left:20px!important;padding-right:20px!important}}</style></head>
<body style="margin:0;background:#ffffff">
<div style="display:none;max-height:0;overflow:hidden">{{pre_cabecalho}}</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" bgcolor="#ffffff"><tr><td align="center">
<table role="presentation" class="w" width="600" cellpadding="0" cellspacing="0" style="width:600px">
<tr><td align="center" style="padding:28px 40px 20px"><img src="{{loja_logo}}" width="140" alt="{{loja_nome}}" style="width:140px;height:auto"></td></tr>
<tr><td class="px" align="left" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:normal;line-height:1.5;color:#000000;padding:8px 40px 16px">Oi, {{nome}},</td></tr><tr><td class="px" align="left" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:normal;line-height:1.5;color:#000000;padding:0 40px 16px">{{paragrafo_1}}</td></tr><tr><td class="px" align="left" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:normal;line-height:1.5;color:#000000;padding:0 40px 16px"><b>{{oferta_titulo}}</b> com o cupom <b>{{cupom}}</b>, até {{prazo}}.</td></tr><tr><td class="px" align="left" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:normal;line-height:1.5;color:#000000;padding:0 40px 16px"><a href="{{link}}" style="color:#000000;font-weight:bold">{{cta}}</a></td></tr><tr><td class="px" align="left" style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:normal;line-height:1.5;color:#000000;padding:8px 40px 28px">{{remetente_nome}}<br>{{remetente_cargo}}, {{loja_nome}}</td></tr><tr><td class="px" align="left" style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:normal;line-height:1.5;color:#333333;padding:0 40px 28px">P.S. {{ps}}</td></tr>
<tr><td align="center" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;color:#777777;padding:24px 40px 40px;border-top:1px solid #e5e5e5">{{loja_nome}} · {{loja_endereco}}<br><a href="{{unsubscribe_link}}" style="color:#777777">Descadastrar</a></td></tr>
</table></td></tr></table></body></html>
